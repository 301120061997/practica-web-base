<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica web — Informática III</title>
  </head>
  <body class="bg-gray-100 text-gray-800">
    <!-- EJERCICIO 1: construye aquí tu página (header, main con #catalogo, footer).
         Las instrucciones están en el README. -->
         <header class="bg-blue-600 text-white p-6 text-center">
  <h1 class="text-3xl font-bold">Accesorios Movika</h1>
  <p class="text-lg">"Momentos que brillan"</p>
</header>

<main class="p-4">
  <div id="filtros" class="flex flex-wrap gap-2 mb-4">
  <button data-categoria="todos" class="px-4 py-2 rounded bg-blue-600 text-white">Todos</button>
  <button data-categoria="Collares" class="px-4 py-2 rounded bg-white text-gray-800 shadow">Collares</button>
  <button data-categoria="Aretes" class="px-4 py-2 rounded bg-white text-gray-800 shadow">Aretes</button>
  <button data-categoria="Pulseras" class="px-4 py-2 rounded bg-white text-gray-800 shadow">Pulseras</button>
</div>
  <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
</div>
  <section class="mt-8">
    <h2 class="text-2xl font-bold mb-4">Pedidos registrados</h2>
    <div id="pedidos-registrados" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </section>


  
</main>
<aside class="p-4 bg-white rounded-lg shadow m-4">
  <h2 class="text-xl font-bold mb-2">Mi pedido</h2>
  <ul id="lista-pedido" class="mb-4"></ul>
  <p id="total" class="font-semibold">Total: $0</p>
  <form id="form-cliente" class="mt-4 space-y-3" novalidate>
  <div>
    <label for="nombre" class="block text-sm font-medium">Nombre</label>
    <input id="nombre" type="text" class="w-full border rounded p-2">
    <p id="error-nombre" class="text-sm text-red-600 hidden"></p>
  </div>

  <div>
    <label for="telefono" class="block text-sm font-medium">Teléfono</label>
    <input id="telefono" type="text" class="w-full border rounded p-2">
    <p id="error-telefono" class="text-sm text-red-600 hidden"></p>
  </div>

  <div>
    <label for="correo" class="block text-sm font-medium">Correo</label>
    <input id="correo" type="text" class="w-full border rounded p-2">
    <p id="error-correo" class="text-sm text-red-600 hidden"></p>
  </div>

  <p id="error-pedido" class="text-sm text-red-600 hidden"></p>

  <button type="submit" class="w-full bg-blue-600 text-white rounded p-2">
    Confirmar pedido
  </button>
</form>
  <button id="btn-vaciar" class="mt-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">Vaciar pedido</button>
</aside>
<footer class="p-4 text-center text-sm text-gray-500">
  Equipo: Bombastic
</footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
